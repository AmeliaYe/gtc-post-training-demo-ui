<!doctype html>
<html lang="en" data-revision="gtc-workflow-r02">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Five steps from zero to a trained assistant.">
  <link rel="icon" href="data:,">
  <title>Nemotron | The Workflow</title>
  <link rel="stylesheet" href="assets/press.css">
  <link rel="stylesheet" href="assets/how-it-learns.css">
</head>
<body class="gtc-workflow">
  <main>
    <header class="workflow-heading">
      <div>
        <h1>Post-training Workflow</h1>
        <p class="workflow-subtitle">5 steps from zero to a trained model.</p>
      </div>
      <nav class="page-switcher" aria-label="Demo pages">
        <button type="button" data-demo-stage="landing" aria-label="1. Robot introduction" title="Robot introduction" aria-pressed="false">1</button>
        <button type="button" data-demo-stage="how-it-learns" aria-label="2. Post-training workflow" title="Post-training workflow" aria-pressed="true">2</button>
        <button type="button" data-demo-stage="gallery" aria-label="3. Use cases" title="Use cases" aria-pressed="false">3</button>
      </nav>
    </header>

    <section class="workflow" aria-label="Five-step post-training workflow">
      <ol class="workflow-steps">
        <li class="workflow-step">
          <span class="step-number">1</span>
          <h2>Start with a<br><span class="nemotron">Nemotron</span> base model</h2>
        </li>
        <li class="workflow-step">
          <span class="step-number">2</span>
          <h2>Prepare domain<br>training tasks</h2>
        </li>
        <li class="workflow-step">
          <span class="step-number">3</span>
          <h2>Practice in<br><span class="nemotron">NeMo Gym</span></h2>
        </li>
        <li class="workflow-step">
          <span class="step-number">4</span>
          <h2>Train with<br><span class="nemotron">NeMo RL</span></h2>
        </li>
        <li class="workflow-step">
          <span class="step-number">5</span>
          <h2>Evaluate the specialized<br><span class="nemotron">Nemotron</span></h2>
        </li>
      </ol>
    </section>

  </main>
  <script type="module" src="assets/how-it-learns.js"></script>
</body>
</html>

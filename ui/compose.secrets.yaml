# Optional overlay; create both ignored files first (an empty file means no API key).
services:
  backend:
    environment:
      BASELINE_API_KEY: ""
      CHECKPOINT_API_KEY: ""
      BASELINE_API_KEY_FILE: /run/secrets/baseline_api_key
      CHECKPOINT_API_KEY_FILE: /run/secrets/checkpoint_api_key
    secrets:
      - baseline_api_key
      - checkpoint_api_key
secrets:
  baseline_api_key:
    file: ./.secrets/baseline_api_key
  checkpoint_api_key:
    file: ./.secrets/checkpoint_api_key
